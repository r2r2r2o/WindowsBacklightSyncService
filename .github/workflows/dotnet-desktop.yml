# Builds and publishes WindowsBacklightSyncService (a .NET 10 Windows service) and
# uploads the self-contained win-x64 output as a build artifact.
#
# NOTE: replaces the stock "WPF/Windows Forms" template, which referenced a
# placeholder solution name, MSBuild, MSIX packaging and signing — none of
# which apply to this project.

name: Build WindowsBacklightSyncService

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x   # matches TargetFramework net10.0-windows

      # Restore + build + publish in one step. Self-contained = the target
      # machine needs no .NET runtime installed. The publish folder is exactly
      # what scripts/install.ps1 expects.
      - name: Publish (self-contained, win-x64)
        run: dotnet publish WindowsBacklightSyncService.csproj -c Release -r win-x64 --self-contained true -o publish

      # Smoke test: the diagnostic mode must run and exit 0 on the runner too.
      # (On CI hardware there is no backlight, so it reports signals as
      # unavailable and exits cleanly — which is the expected behavior.)
      - name: Smoke test (--check)
        run: .\publish\WindowsBacklightSyncService.exe --check
        shell: pwsh

      - name: Run unit tests
        run: dotnet test WindowsBacklightSyncService.Tests\WindowsBacklightSyncService.Tests.csproj -c Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: WindowsBacklightSyncService-win-x64
          path: publish
          if-no-files-found: error
