# Builds the service and publishes a GitHub Release with TWO zip bundles:
#
#   1. BacklightSyncService-v<ver>-win-x64-selfcontained.zip
#        - self-contained: carries its own .NET runtime, runs on any Windows 10/11
#        - larger (~70 MB)
#   2. BacklightSyncService-v<ver>-win-x64-frameworkdependent.zip
#        - framework-dependent: requires the .NET 10 Runtime installed on the target
#        - much smaller (a few hundred KB)
#
# Trigger: push a version tag, e.g.  git tag v1.4.0 && git push origin v1.4.0
# (or run manually from the Actions tab — the version is then read from the csproj).
#
# Both zips contain the binaries in a "publish" folder together with
# scripts\install.ps1, so installing a release is:
#   download zip -> extract -> run publish\scripts\install.ps1 (elevated)

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # --- Self-contained build: no .NET runtime needed on the target machine ---
      - name: Publish (self-contained win-x64)
        run: dotnet publish BacklightSyncService.csproj -c Release -r win-x64 --self-contained true -o publish

      # --- Framework-dependent build: needs .NET 10 Runtime on the target ---
      - name: Publish (framework-dependent win-x64)
        run: dotnet publish BacklightSyncService.csproj -c Release -r win-x64 --self-contained false -o publish-fd

      - name: Smoke test (self-contained --check)
        run: .\publish\BacklightSyncService.exe --check
        shell: pwsh

      - name: Smoke test (framework-dependent --check)
        run: .\publish-fd\BacklightSyncService.exe --check
        shell: pwsh

      # Make both bundles self-contained in the install-script sense: put
      # scripts + docs next to each exe.
      - name: Stage release bundles
        shell: pwsh
        run: |
          foreach ($dir in @('publish', 'publish-fd')) {
            Copy-Item -Path scripts -Destination "$dir\scripts" -Recurse -Force
            Copy-Item -Path README.md -Destination "$dir\README.md" -Force
            if (Test-Path LICENSE.txt) { Copy-Item -Path LICENSE.txt -Destination "$dir\LICENSE.txt" -Force }
          }

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $csprojVersion = [regex]::Match((Get-Content BacklightSyncService.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($csprojVersion -and $version -ne $csprojVersion) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match <Version>$csprojVersion</Version> in BacklightSyncService.csproj — bump the version and re-tag."
            }
          } else {
            $version = if ($csprojVersion) { $csprojVersion } else { 'manual' }
          }
          Write-Host "Release version: v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create zips + checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $names = @(
            "BacklightSyncService-v$env:VERSION-win-x64-selfcontained",
            "BacklightSyncService-v$env:VERSION-win-x64-frameworkdependent"
          )
          $srcDirs = @('publish', 'publish-fd')
          for ($i = 0; $i -lt $names.Count; $i++) {
            $zip = "$($names[$i]).zip"
            Compress-Archive -Path $srcDirs[$i] -DestinationPath $zip -CompressionLevel Optimal
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$hash  $zip" | Set-Content -Path "$zip.sha256"
            Write-Host "Created $zip"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zips = @(
            "BacklightSyncService-v$env:VERSION-win-x64-selfcontained.zip",
            "BacklightSyncService-v$env:VERSION-win-x64-frameworkdependent.zip"
          )
          gh release view "v$env:VERSION" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$env:VERSION already exists — deleting and recreating."
            gh release delete "v$env:VERSION" --yes --cleanup-tag
          }
          $assets = @()
          foreach ($zip in $zips) {
            $assets += $zip
            $assets += "$zip.sha256"
          }
          gh release create "v$env:VERSION" @assets `
            --title "BacklightSyncService v$env:VERSION" `
            --generate-notes
