# Builds the service and publishes a GitHub Release with TWO zip bundles:
#
#   1. WindowsBacklightSyncService-v<ver>-win-x64-selfcontained.zip
#        - self-contained: carries its own .NET runtime, runs on any Windows 10/11
#        - larger (~70 MB)
#   2. WindowsBacklightSyncService-v<ver>-win-x64-frameworkdependent.zip
#        - framework-dependent: requires the .NET 10 Runtime installed on the target
#        - much smaller (a few hundred KB)
#
# FULLY AUTOMATIC — two ways to trigger:
#   A) Push to main: a release is created only when the <Version> in
#      WindowsBacklightSyncService.csproj is NEWER than the version of the latest
#      existing release. No tags to push — just bump the version and commit.
#   B) Push a version tag (git tag v1.4.0 && git push origin v1.4.0):
#      always creates/refreshes a release for that exact version.
#   C) Run manually from the Actions tab (uses the csproj version).
#
# Both zips contain the binaries in a "publish" folder together with
# scripts\install.ps1, so installing a release is:
#   download zip -> extract -> run publish\scripts\install.ps1 (elevated)

name: Release

on:
  push:
    branches: [ "main" ]
    # Match BOTH v-prefixed tags (v1.4.0) and bare version tags (1.4.0).
    tags: [ 'v*', '[0-9]*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # --- Self-contained build: no .NET runtime needed on the target machine ---
      - name: Publish (self-contained win-x64)
        run: dotnet publish WindowsBacklightSyncService.csproj -c Release -r win-x64 --self-contained true -o publish

      # --- Framework-dependent build: needs .NET 10 Runtime on the target ---
      - name: Publish (framework-dependent win-x64)
        run: dotnet publish WindowsBacklightSyncService.csproj -c Release -r win-x64 --self-contained false -o publish-fd

      - name: Smoke test (self-contained --check)
        run: .\publish\WindowsBacklightSyncService.exe --check
        shell: pwsh

      - name: Smoke test (framework-dependent --check)
        run: .\publish-fd\WindowsBacklightSyncService.exe --check
        shell: pwsh

      # Make both bundles self-contained in the install-script sense: put
      # scripts + docs next to each exe.
      - name: Stage release bundles
        shell: pwsh
        run: |
          foreach ($dir in @('publish', 'publish-fd')) {
            Copy-Item -Path scripts -Destination "$dir\scripts" -Recurse -Force
            Copy-Item -Path README.md -Destination "$dir\README.md" -Force
            # The repo ships the license as "LICENSE" (no extension) — try both spellings.
            foreach ($license in @('LICENSE', 'LICENSE.txt')) {
              if (Test-Path $license) {
                Copy-Item -Path $license -Destination "$dir\LICENSE.txt" -Force
                break
              }
            }
          }

      # Decide whether to create a release and which version to use.
      #   tag trigger   -> version = tag (with or without the "v" prefix), always release;
      #                    validates against the csproj version
      #   branch/manual -> version = csproj, release only if newer than the latest release
      # Emits lowercase "true"/"false" so the `if:` condition matches reliably.
      - name: Determine version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-Version([string]$tag) {
            if ($tag -match '^v?(\d+)\.(\d+)\.(\d+)') {
              return [version]"$($matches[1]).$($matches[2]).$($matches[3])"
            }
            return $null
          }

          $shouldRelease = $false
          $csprojVersion = [regex]::Match((Get-Content WindowsBacklightSyncService.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')   # handles both v1.4.0 and 1.4.0
            if ($csprojVersion -and $version -ne $csprojVersion) {
              throw "Tag '$env:GITHUB_REF_NAME' does not match <Version>$csprojVersion</Version> in WindowsBacklightSyncService.csproj — bump the version and re-tag."
            }
            $shouldRelease = $true
            Write-Host "Tagged run: releasing v$version (explicit tag)."
          } else {
            if (-not $csprojVersion) { throw "No <Version> found in WindowsBacklightSyncService.csproj." }
            $csprojVer = [version]$csprojVersion

            $existingTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>$null)
            $latestVer = $existingTags | ForEach-Object { Get-Version $_ } | Where-Object { $_ } | Sort-Object | Select-Object -Last 1

            if ($latestVer -and $csprojVer -le $latestVer) {
              $shouldRelease = $false
              Write-Host "Version v$csprojVersion is not newer than the latest release v$latestVer — skipping release creation."
            } else {
              $shouldRelease = $true
              Write-Host "Version v$csprojVersion will be released (latest existing: $(if ($latestVer) { 'v' + $latestVer } else { 'none' }))."
            }
            $version = $csprojVersion
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create zips + checksums
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $names = @(
            "WindowsBacklightSyncService-v$env:VERSION-win-x64-selfcontained",
            "WindowsBacklightSyncService-v$env:VERSION-win-x64-frameworkdependent"
          )
          $srcDirs = @('publish', 'publish-fd')
          for ($i = 0; $i -lt $names.Count; $i++) {
            $zip = "$($names[$i]).zip"
            Compress-Archive -Path $srcDirs[$i] -DestinationPath $zip -CompressionLevel Optimal
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$hash  $zip" | Set-Content -Path "$zip.sha256"
            Write-Host "Created $zip"
          }

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zips = @(
            "WindowsBacklightSyncService-v$env:VERSION-win-x64-selfcontained.zip",
            "WindowsBacklightSyncService-v$env:VERSION-win-x64-frameworkdependent.zip"
          )
          gh release view "v$env:VERSION" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$env:VERSION already exists — deleting and recreating."
            gh release delete "v$env:VERSION" --yes --cleanup-tag
          }
          $assets = @()
          foreach ($zip in $zips) {
            $assets += $zip
            $assets += "$zip.sha256"
          }
          gh release create "v$env:VERSION" @assets `
            --target ${{ github.sha }} `
            --title "WindowsBacklightSyncService v$env:VERSION" `
            --generate-notes

      - name: Show result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 5
